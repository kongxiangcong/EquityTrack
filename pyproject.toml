[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-equity-research"
version = "0.3.0"
description = "Evidence-constrained professional equity research narrative core"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
equity-research = "equity_research.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
