[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-equity-research"
version = "0.3.0"
description = "Evidence-constrained professional equity research narrative core"
requires-python = ">=3.10"
dependencies = [
  "reportlab==4.4.9",
]

[project.optional-dependencies]
browser-test = [
  "websocket-client==1.9.0",
]

[project.scripts]
trading-platform = "trading_platform.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-m 'not release_acceptance'"
markers = [
  "release_acceptance: explicit release gate that executes the acceptance suite ledger",
]
