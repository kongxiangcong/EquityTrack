[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-equity-research"
version = "0.3.0"
description = "Evidence-constrained professional equity research narrative core"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
browser-test = [
  "websocket-client==1.9.0",
]

[project.scripts]
equity-research = "equity_research.cli:main"
trading-platform = "trading_platform.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
