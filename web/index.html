<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>版本化 K 线工作台</title><link rel="stylesheet" href="/src/styles.css"></head>
<body><main>
  <header><div><p class="eyebrow">LOCAL RESEARCH WORKSPACE</p><h1>意华股份 <span>002897.SZ</span></h1></div><button id="fullscreen" type="button" aria-label="切换全屏视图">全屏查看</button></header>
  <section class="status" aria-label="图表数据状态"><strong>日 K · 未复权</strong><span id="session">有效交易日 —</span><span id="freshness">数据状态 —</span></section>
  <section id="banner" class="banner" role="status">正在读取冻结快照…</section>
  <section class="workspace"><div class="canvas"><div id="chart" aria-label="版本化 K 线和成交量图"></div><div class="draw-flow" aria-label="标注绘制步骤"><label>起点价格<input id="start-price" inputmode="decimal" aria-describedby="save-status"></label><button id="start" type="button">1 确认起点</button><label>终点价格<input id="end-price" inputmode="decimal" aria-describedby="save-status"></label><button id="finish" type="button" disabled>2 确认终点</button><button id="confirm" type="button" disabled>3 确认并持久化</button><span id="save-status" role="status">尚未绘制</span></div></div>
  <details class="ledger-panel" open><summary>标注版本账本</summary><p>修改、删除和恢复都会追加版本，不覆盖历史。</p><div class="ledger-actions"><button id="revise" type="button" disabled>追加修订</button><button id="delete" type="button" disabled>追加删除版本</button><button id="restore" type="button" disabled>追加恢复版本</button></div><ol id="ledger"></ol></details></section>
  <details><summary>数据详情与引用</summary><pre id="details"></pre></details>
</main><script type="module" src="/src/app.js"></script></body></html>
